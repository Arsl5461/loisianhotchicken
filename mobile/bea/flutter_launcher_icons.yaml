flutter_launcher_icons:
  image_path: "assets/app_icon.png"

  android: true
  min_sdk_android: 21

  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app_icon_foreground.png"

  ios: true
  remove_alpha_ios: true

  web:
    generate: true
    image_path: "assets/app_icon.png"
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"

  windows:
    generate: true
    image_path: "assets/app_icon.png"
    icon_size: 48

  macos:
    generate: true
    image_path: "assets/app_icon.png"
