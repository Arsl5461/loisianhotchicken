name: OApp
description: A new Flutter project.
publish_to: "none"

version: 1.0.9+11

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Local package
  image_editor_plus:
    path: image_editor_plus

  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^11.0.0
  google_maps_flutter: ^2.5.0
  image_picker: ^1.2.0
  camera: ^0.12.0+2
  geolocator: ^14.0.2
  geocoding: ^5.0.1
  permission_handler: ^12.0.1
  local_auth: ^3.0.2
  flutter_contacts: ^2.1.0
  intl_phone_number_input: ^0.7.4
  flutter_svg: ^2.0.10+1
  lucide_icons_flutter: ^4.0.2
  page_transition: ^2.2.1
  dio: ^5.9.1
  fluttertoast: ^9.0.0
  connectivity_plus: ^7.0.0
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.3
  get: ^4.7.3
  socket_io_client: ^3.1.4
  intl: ^0.20.2
  get_storage: ^2.1.1
  url_launcher: ^6.3.0
  share_plus: ^13.3.1
  app_links: ^7.0.0

  # Firebase
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  firebase_storage: ^14.0.1
  firebase_remote_config: ^7.0.1

  path_provider: ^2.1.5
  uuid: ^4.5.3
  path: ^1.9.1
  photo_manager: ^3.9.0
  photo_manager_image_provider: ^2.2.0
  mime: ^2.0.0
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  just_audio: ^0.10.5
  file_picker: ^13.3.2
  flutter_screenutil: ^5.9.3

  # Auth
  google_sign_in: ^7.2.0
  flutter_facebook_auth: ^7.1.6
  sign_in_with_apple: ^7.0.1

  # Payments
  flutter_stripe: ^13.0.0

  flutter_dotenv: ^6.0.1
  device_preview: ^1.3.1

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  pretty_dio_logger: ^1.4.0
  change_app_package_name: ^1.5.0
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/icons/
    - assets/svg/
    - assets/flags/
    - assets/bubba/settings/
    - assets/bubba/prefs/
    - assets/bubba/security/

  fonts:
    - family: PublicSans
      fonts:
        - asset: assets/fonts/PublicSans-Thin.otf
          weight: 100
        - asset: assets/fonts/PublicSans-ExtraLight.otf
          weight: 200
        - asset: assets/fonts/PublicSans-Light.otf
          weight: 300
        - asset: assets/fonts/PublicSans-Regular.otf
          weight: 400
        - asset: assets/fonts/PublicSans-Medium.otf
          weight: 500
        - asset: assets/fonts/PublicSans-SemiBold.otf
          weight: 600
        - asset: assets/fonts/PublicSans-Bold.otf
          weight: 700
        - asset: assets/fonts/PublicSans-ExtraBold.otf
          weight: 800
        - asset: assets/fonts/PublicSans-Black.otf
          weight: 900

    - family: Urbanist
      fonts:
        - asset: assets/fonts/Urbanist-Thin.ttf
          weight: 100
        - asset: assets/fonts/Urbanist-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Urbanist-Light.ttf
          weight: 300
        - asset: assets/fonts/Urbanist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Urbanist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Urbanist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Urbanist-Bold.ttf
          weight: 700
        - asset: assets/fonts/Urbanist-ExtraBold.ttf
          weight: 800

    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlayfairDisplay-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlayfairDisplay-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlayfairDisplay-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlayfairDisplay-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/PlayfairDisplay-Black.ttf
          weight: 900

    - family: Canela
      fonts:
        - asset: assets/fonts/Canela-Light.otf
          weight: 300
        - asset: assets/fonts/Canela-Regular.otf
          weight: 400
        - asset: assets/fonts/Canela-Medium.otf
          weight: 500
        - asset: assets/fonts/Canela-Bold.otf
          weight: 700

    - family: Lato
      fonts:
        - asset: assets/fonts/Lato-Light.ttf
          weight: 300
        - asset: assets/fonts/Lato-Regular.ttf
          weight: 400
        - asset: assets/fonts/Lato-Medium.ttf
          weight: 500
        - asset: assets/fonts/Lato-Semibold.ttf
          weight: 600
        - asset: assets/fonts/Lato-Bold.ttf
          weight: 700
        - asset: assets/fonts/Lato-Heavy.ttf
          weight: 800
        - asset: assets/fonts/Lato-Black.ttf
          weight: 900

# APP ICON
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app_icon_foreground.png"
  remove_alpha_ios: true

# SPLASH SCREEN
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/splash/bubba_splash_logo.png

  android: true
  ios: true

  android_12:
    image: assets/splash/bubba_splash_logo_android12.png
    color: "#FFFFFF"
    icon_background_color: "#FFFFFF"

  web: false
