name: lhc_admin
description: Louisiana Hot Chicken Admin mobile app for iOS and Android.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  fl_chart: ^0.70.2
  intl: ^0.20.2
  image_picker: ^1.1.2
  file_picker: ^8.3.7
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logo.jpg
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#A6190F"
  adaptive_icon_foreground: assets/logo.jpg


flutter:
  uses-material-design: true
  assets:
    - assets/logo.jpg
